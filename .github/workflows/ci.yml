---
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ansible:
    name: yamllint, syntax-check, ansible-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.13"

      - name: Install pinned tooling
        run: python -m pip install ansible-core==2.21.5 ansible-lint==26.10.1 yamllint==1.38.0

      - name: Install collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: yamllint
        run: yamllint --strict .

      - name: Syntax check playbooks
        run: |
          ansible-playbook --syntax-check -i inventories/example/hosts.yml playbooks/backup.yml
          ansible-playbook --syntax-check -i inventories/example/hosts.yml playbooks/restore.yml

      - name: ansible-lint (production profile)
        run: ansible-lint

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform/s3-backup-bucket
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate
