---
# Example inventory. Hostnames and values are placeholders.
#
# Environment groups (prod, staging, qa) set `env_name`, which the restore guard
# trusts over anything a requester types. Functional groups decide what each
# playbook may touch:
#   mysql_backup_sources  - hosts that take backups (ideally a replica)
#   mysql_restore_targets - writable NON-prod primaries that may receive restores
# prod is deliberately not a member of mysql_restore_targets.
all:
  children:
    prod:
      vars:
        env_name: prod
      hosts:
        prod-db-replica-01.example.com:
    staging:
      vars:
        env_name: staging
      hosts:
        staging-db-01.example.com:
    qa:
      vars:
        env_name: qa
      hosts:
        qa-db-01.example.com:

    mysql_backup_sources:
      hosts:
        prod-db-replica-01.example.com:

    mysql_restore_targets:
      children:
        staging:
        qa:
